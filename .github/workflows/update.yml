name: Update NECRON Configs

on:
  schedule:
    - cron: '0 * * * *'      # каждый час в 0 минут
  workflow_dispatch:         # можно запускать вручную

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # ← ТОКЕН УБРАН — теперь работает дефолтный GITHUB_TOKEN с правами write

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run config collector
        run: |
          python scripts/update_configs.py
          echo "=== ПЕРВЫЕ 20 СТРОК НОВОГО configs.txt ==="
          head -n 20 configs.txt

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add configs.txt version.txt -f
          
          if git diff --staged --quiet; then
            echo "❌ Нет изменений"
          else
          git fetch origin main
          git pull --rebase origin main # Это самое главное
          
            git commit -m "🔄 Автообновление NECRON конфигов $(date +%Y-%m-%d_%H:%M)"
            git push
            echo "✅ Обновлено и запушено!"
          fi
